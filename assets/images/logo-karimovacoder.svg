<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="brandCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="brandViolet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="60%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="shardCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="shardPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="60%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Chrome Metallic Text Gradient for KARIMOVA -->
    <linearGradient id="chromeTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="coderBadgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.2)"/>
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0.2)"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="brandGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="45" result="amb"/>
      <feMerge>
        <feMergeNode in="amb"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Holographic Aura -->
  <circle cx="300" cy="205" r="140" fill="url(#brandCyanBlue)" opacity="0.16" filter="url(#softAura)"/>

  <!-- ========================================================================
       1. THE QUANTUM "KC" CIPHER EMBLEM
       ======================================================================== -->
  <g transform="translate(68, 15) scale(0.85)" filter="url(#brandGlowFilter)">
    <!-- 1. Left Vertical Pillar -->
    <path d="M 140 140
             C 140 125, 152 115, 165 115
             L 185 115
             C 198 115, 208 125, 208 140
             L 208 360
             C 208 375, 198 385, 185 385
             L 165 385
             C 152 385, 140 375, 140 360
             Z"
          fill="url(#shardCyan)"/>

    <path d="M 158 135 L 170 135 L 170 365 L 158 365 Z" fill="#FFFFFF" opacity="0.35"/>

    <!-- 2. Upper Diagonal Chevron (K top arm) -->
    <path d="M 226 230
             L 315 132
             C 324 122, 340 122, 350 132
             L 368 152
             C 376 161, 374 176, 364 185
             L 282 265
             Z"
          fill="url(#shardCyan)"/>

    <!-- 3. Lower Diagonal Chevron (K bottom arm) -->
    <path d="M 282 235
             L 364 315
             C 374 324, 376 339, 368 348
             L 350 368
             C 340 378, 324 378, 315 368
             L 226 270
             Z"
          fill="url(#shardPurple)"/>

    <!-- 4. Sweeping "C" Outer Enclosing Shield -->
    <path d="M 340 95
             C 400 95, 445 140, 450 200
             L 405 200
             C 400 165, 375 135, 335 135
             L 310 135
             C 302 135, 298 125, 304 118
             L 325 98
             C 330 96, 335 95, 340 95
             Z"
          fill="url(#brandCyanBlue)"/>

    <path d="M 340 405
             C 400 405, 445 360, 450 300
             L 405 300
             C 400 335, 375 365, 335 365
             L 310 365
             C 302 365, 298 375, 304 382
             L 325 402
             C 330 404, 335 405, 340 405
             Z"
          fill="url(#brandViolet)"/>

    <!-- Nexus Center Glow -->
    <circle cx="254" cy="250" r="9" fill="#FFFFFF"/>
    <circle cx="254" cy="250" r="4.5" fill="#38BDF8"/>
  </g>

  <!-- ========================================================================
       2. TYPOGRAPHY: "KARIMOVA CODER" BESPOKE BRAND LOCKUP
       ======================================================================== -->
  <g transform="translate(300, 415)" text-anchor="middle">
    
    <!-- Primary Brand Name: KARIMOVA -->
    <text font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="7" 
          fill="url(#chromeTextGrad)">
      KARIMOVA
    </text>

    <!-- Subtitle: Futuristic Tech Badge [ < CODER /> ] -->
    <g transform="translate(0, 38)">
      <!-- Badge pill background -->
      <rect x="-105" y="-18" width="210" height="34" rx="17" 
            fill="url(#coderBadgeGrad)" 
            stroke="#38BDF8" 
            stroke-width="1.2" 
            stroke-opacity="0.45"/>

      <!-- Left Bracket `<` -->
      <text x="-65" y="5" 
            font-family="'JetBrains Mono', monospace" 
            font-size="16" 
            font-weight="800" 
            fill="#38BDF8" 
            opacity="0.9">&lt;</text>

      <!-- CODER Text -->
      <text x="0" y="5" 
            font-family="'JetBrains Mono', monospace" 
            font-size="16" 
            font-weight="800" 
            letter-spacing="5" 
            fill="#F8FAFC">
        CODER
      </text>

      <!-- Right Bracket `/>` -->
      <text x="65" y="5" 
            font-family="'JetBrains Mono', monospace" 
            font-size="16" 
            font-weight="800" 
            fill="#8B5CF6" 
            opacity="0.9">/&gt;</text>
    </g>

    <!-- Accent Circuit Line & Nodes underneath -->
    <g transform="translate(0, 72)" opacity="0.6">
      <line x1="-140" y1="0" x2="-25" y2="0" stroke="url(#brandCyanBlue)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#38BDF8"/>
      <line x1="25" y1="0" x2="140" y2="0" stroke="url(#brandViolet)" stroke-width="1.5"/>
    </g>
  </g>
</svg>
